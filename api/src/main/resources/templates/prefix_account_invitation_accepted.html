<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Invitation response</title>

    <!-- STYLES -->
    <style type="text/css">
        body
        {
            margin:0;
            padding:0;
            background:#f4f5f6;
            font-family: Helvetica, Arial, sans-serif;
        }

        table
        {
            border-collapse: separate;
            width:100%;
        }

        td
        {
            font-family: Helvetica, Arial, sans-serif;
        }

        .container
        {
            max-width:600px;
            margin:0 auto;
            padding:24px 12px;
        }

        .card
        {
            background:#ffffff;
            border:1px solid #eaebed;
            border-radius:16px;
            overflow:hidden;
        }

        .header
        {
            padding:18px 24px;
            background:#ffffff;
            border-bottom:1px solid #eaebed;
        }

        .header-inner
        {
            width:100%;
        }

        .logo
        {
            display:block;
            height:64px;
        }

        .title
        {
            font-size:16px;
            color:#111827;
            font-weight:700;
            text-align:right;
        }

        .content
        {
            padding:24px;
        }

        h2
        {
            margin:0 0 12px 0;
            font-size:20px;
            line-height:1.2;
            color:#111827;
        }

        p
        {
            margin:0 0 14px 0;
            font-size:16px;
            line-height:1.45;
            color:#111827;
        }

        .muted
        {
            color:#6b7280;
            font-size:14px;
        }

        .pillbox
        {
            margin:14px 0 18px 0;
            padding:12px 14px;
            border:1px solid #eaebed;
            border-radius:12px;
            background:#fafafa;
        }

        .pillbox b
        {
            color:#111827;
        }

        .btn-wrap
        {
            padding:8px 0 0 0;
        }

        .btn
        {
            display:inline-block;
            background:#0867ec;
            color:#ffffff !important;
            text-decoration:none;
            font-weight:700;
            padding:12px 18px;
            border-radius:10px;
        }

        .footer
        {
            text-align:center;
            padding:18px 24px;
            color:#9a9ea6;
            font-size:14px;
        }

        .footer a
        {
            color:#6b7280;
            text-decoration:underline;
        }

        @media only screen and (max-width: 640px)
        {
            .container
            {
                padding:12px 8px;
            }

            .content
            {
                padding:18px;
            }

            .title
            {
                text-align:left;
                padding-top:8px;
            }

            .btn
            {
                display:block;
                text-align:center;
            }
        }
    </style>
</head>

<body>
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td>
            <div class="container">
                <table role="presentation" class="card" cellpadding="0" cellspacing="0" border="0">

                    <tr>
                        <td class="header">
                            <img class="logo" src="{logoUrl}" alt="{title} logo">
                        </td>
                    </tr>

                    <tr>
                        <td class="content">
                            <h2>Invitation accepted</h2>

                            <p>
                                You have successfully accepted the invitation on
                                <strong>PID Central Catalogue</strong>.
                                You can now access the prefix.
                            </p>

                            <div class="pillbox">
                                <p style="margin:0;">
                                    Provider: <strong>{providerName}</strong><br>
                                    Prefix: <strong>{prefixName}</strong><br>
                                    Role: <strong>{role}</strong>
                                </p>
                            </div>

                            <div class="btn-wrap">
                                <a class="btn" href="{prefixDetailsUrl}" target="_blank" rel="noopener">
                                    View Prefix Details
                                </a>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td class="footer">
                            <div><b>{title} Team</b></div>
                            <div style="margin-top:6px;">
                                Need more information? Contact us at
                                <a href="mailto:{replyTo}">{replyTo}</a>
                            </div>
                        </td>
                    </tr>

                </table>
            </div>
        </td>
    </tr>
</table>
</body>
</html>
